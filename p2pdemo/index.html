document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"110ee3fe-a872-4012-9b70-f3ad2d1ab028\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"84a2064c-bdf1-4422-811d-17e8c00c4fae\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"84492b89-b441-4fa0-8424-7dfb280e2cf9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"110ee3fe-a872-4012-9b70-f3ad2d1ab028\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002fstyle>\n<script src=\"3cca2fb4-582a-4895-8038-c7f7781ad613\"><\u002fscript>\n<script src=\"c455f3e5-d6a0-4d80-9a72-ed28a8e151f2\"><\u002fscript>\n<script src=\"7ff44fcc-32c2-4994-8748-b195b1efcc65\"><\u002fscript>\n<style>\n:root{--color-accent:#0064F1;--color-accent-100:#EDF4FF;--color-accent-200:#D6E6FF;--color-accent-300:#A0C7FF;--color-accent-400:#7DB3FF;--color-accent-500:#5A9FFF;--color-accent-600:#0055CE;--color-accent-700:#0047AB;--color-accent-800:#00378A;--color-accent-900:#002B66;--color-accent-2:#0064F1;--color-accent-2-100:#EDF4FF;--color-accent-2-200:#D6E6FF;--color-accent-2-800:#00378A;\n--grad-a:linear-gradient(135deg,#0047AB,#0064F1 48%,#378AFF);--grad-a-h:linear-gradient(135deg,#00378A,#0055CE 48%,#1576FF);\n--color-bg:#FDFDFD;--color-surface:#F5F5F6;\n--ok:#178A50;--ok-bg:#E7F5ED;--warn:#C97A06;--warn-bg:#FBF1DF;--bad:#D92D20;--bad-bg:#FCEBE9}\n.btn-primary{background-image:var(--grad-a)}\n.btn-primary:hover,.btn-primary:active{background-image:var(--grad-a-h)}\n.table tbody tr:hover{background:color-mix(in srgb, var(--color-accent) 7%, transparent)}\nbody{margin:0}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-600)}\ninput::placeholder,textarea::placeholder{color:var(--color-neutral-500)}\n@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}\n@keyframes paneIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n<\u002fstyle>\n<\u002fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);{{accVars}}\">\n\n<sc-if value=\"{{isLogin}}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Login\" style=\"min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr\">\n  <div style=\"background:var(--grad-a);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:3px\">\n      <div style=\"width:100px;height:22px;overflow:hidden;position:relative;flex:none\">\n        <img src=\"4210cbfd-764f-4c3d-9ee2-3201a16d4e24\" alt=\"CFOLogic\" style=\"position:absolute;width:269px;left:-85px;top:-121px;max-width:none\">\n      <\u002fdiv>\n      <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-family:'Syne',var(--font-heading),sans-serif;font-weight:600;font-size:17px;letter-spacing:0.04em\">Command&nbsp;Center<\u002fspan><span style=\"font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.55);padding:2px 7px;border-radius:999px;opacity:0.9\">P2P<\u002fspan><\u002fspan>\n    <\u002fdiv>\n    <div>\n      <div style=\"font-size:12px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.8;margin-bottom:12px\">P2P Command Center<\u002fdiv>\n      <h1 style=\"font-size:58px;line-height:1.02;margin:0 0 16px;letter-spacing:-0.02em;max-width:10em;color:#fff\">Every invoice <span style=\"opacity:0.6\">owned.<\u002fspan><\u002fh1>\n      <p style=\"font-size:16px;margin:0;opacity:0.85;max-width:34em\">One board for the whole purchase-to-pay flow \u2014 who has it, how long, and what it needs next. Reads from SAP. Never writes to it.<\u002fp>\n    <\u002fdiv>\n    <div>\n      <div style=\"display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-top:1px solid rgba(255,255,255,0.35);font-size:14px\"><span>200 open items, hunted daily<\u002fspan><span style=\"opacity:0.7\">Sorted, aged and owned on one board<\u002fspan><\u002fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-top:1px solid rgba(255,255,255,0.35);font-size:14px\"><span>20 follow-ups per invoice<\u002fspan><span style=\"opacity:0.7\">The nudge engine chases; people decide<\u002fspan><\u002fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-top:1px solid rgba(255,255,255,0.35);font-size:14px\"><span>\"Be stricter\" decays<\u002fspan><span style=\"opacity:0.7\">Adherence measured by person, team and vendor<\u002fspan><\u002fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-top:1px solid rgba(255,255,255,0.35);font-size:14px\"><span>Confidential data<\u002fspan><span style=\"opacity:0.7\">Runs in your Azure tenant, on your identity<\u002fspan><\u002fdiv>\n    <\u002fdiv>\n  <\u002fdiv>\n  <div style=\"display:grid;place-items:center;padding:48px\">\n    <div style=\"width:min(420px,100%)\">\n      <h3 style=\"margin:0 0 4px\">Sign in<\u002fh3>\n      <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 18px\">This is a demo \u2014 pick a seat and see the tower from that chair.<\u002fp>\n      <div style=\"margin-bottom:18px\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--warn);animation:blink 1.6s infinite\"><\u002fspan>Demo mode \u2014 enter as<\u002fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{rolesLogin}}\" as=\"r\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{r.go}}\" style=\"display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--color-neutral-200);background:rgba(255,255,255,0.7);border-radius:14px;padding:10px 14px;font-family:inherit;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(0,71,171,0.05);transition:transform 0.15s,box-shadow 0.15s,border-color 0.15s\" style-hover=\"transform:translateY(-1px);border-color:var(--color-accent);box-shadow:0 10px 26px rgba(0,71,171,0.14)\">\n              <span style=\"width:34px;height:34px;border-radius:50%;background:var(--grad-a);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;font-size:12px;flex:none\">{{r.ini}}<\u002fspan>\n              <span style=\"min-width:0;flex:1\">\n                <span style=\"display:block;font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--color-text)\">{{r.n}}<\u002fspan>\n                <span style=\"display:block;font-size:11.5px;color:var(--color-neutral-600)\">{{r.desc}}<\u002fspan>\n              <\u002fspan>\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002fpath><\u002fsvg>\n            <\u002fbutton>\n          <\u002fsc-for>\n        <\u002fdiv>\n      <\u002fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n        <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002fdiv>\n        <span class=\"text-muted\" style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase\">or in production<\u002fspan>\n        <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002fdiv>\n      <\u002fdiv>\n      <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{loginMs}}\" style=\"margin-bottom:14px\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 23 23\"><rect width=\"10\" height=\"10\" x=\"1\" y=\"1\" fill=\"#fff\"><\u002frect><rect width=\"10\" height=\"10\" x=\"12\" y=\"1\" fill=\"rgba(255,255,255,0.75)\"><\u002frect><rect width=\"10\" height=\"10\" x=\"1\" y=\"12\" fill=\"rgba(255,255,255,0.75)\"><\u002frect><rect width=\"10\" height=\"10\" x=\"12\" y=\"12\" fill=\"rgba(255,255,255,0.55)\"><\u002frect><\u002fsvg>\n        Sign in with Microsoft\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-left:auto\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002fpath><\u002fsvg>\n      <\u002fbutton>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n        <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002fdiv>\n        <span class=\"text-muted\" style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase\">or with email<\u002fspan>\n        <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002fdiv>\n      <\u002fdiv>\n      <div class=\"field\" style=\"margin-bottom:12px;opacity:0.75\"><label>Work email<\u002flabel><input class=\"input\" sc-camel-default-value=\"d.ellis@brazoscopper.example\"><\u002fdiv>\n      <div class=\"field\" style=\"margin-bottom:14px;opacity:0.75\"><label>Password<\u002flabel><input class=\"input\" type=\"password\" sc-camel-default-value=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\"><\u002fdiv>\n      <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{loginMs}}\" style=\"margin-bottom:18px\">Sign in<\u002fbutton>\n      <p class=\"text-muted\" style=\"font-size:12px;margin:0\">Demo data \u2014 not connected to SAP. Any credentials work; production uses Entra ID SSO.<\u002fp>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid var(--color-divider);margin-top:24px;padding-top:14px;font-size:11.5px;color:var(--color-neutral-600)\">\n        <span>\u00a9 2026 CFOLogic, Inc.<\u002fspan>\n        <a style=\"margin-left:auto\">Architecture<\u002fa>\n      <\u002fdiv>\n    <\u002fdiv>\n  <\u002fdiv>\n<\u002fdiv>\n<\u002fsc-if>\n\n<sc-if value=\"{{isApp}}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"App shell\" style=\"display:flex;min-height:100vh\">\n  <div style=\"width:236px;flex:0 0 236px;border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:2px;padding:20px 14px;box-sizing:border-box;position:sticky;top:0;height:100vh;overflow-y:auto\">\n    <div style=\"margin:2px 8px 16px;display:flex;flex-direction:column;gap:3px\">\n      <div style=\"width:100px;height:22px;overflow:hidden;position:relative\">\n        <img src=\"64d4da65-0bf7-4a5c-9e4e-a24ebb60fce2\" alt=\"CFOLogic\" style=\"position:absolute;width:268px;left:-84px;top:-121px;max-width:none\">\n      <\u002fdiv>\n      <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-family:'Syne',var(--font-heading),sans-serif;font-weight:600;font-size:15.5px;letter-spacing:0.03em\">Command&nbsp;Center<\u002fspan><span style=\"font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-accent-800);background:var(--color-accent-100);padding:2px 7px;border-radius:999px\">P2P<\u002fspan><\u002fspan>\n    <\u002fdiv>\n    <button sc-camel-on-click=\"{{openAsk}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;border:none;background:var(--grad-a);color:#fff;font-family:inherit;padding:11px 12px;cursor:pointer;text-align:left;border-radius:12px;margin-bottom:10px;box-shadow:0 8px 22px rgba(0,71,171,0.28);transition:transform 0.15s\" style-hover=\"transform:translateY(-1px)\">\n      <span style=\"width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none\"><navigator-mark static=\"true\" style=\"width:16px;height:16px\"><\u002fnavigator-mark><\u002fspan>\n      <span style=\"min-width:0\"><span style=\"display:block;font-family:var(--font-heading);font-weight:700;font-size:14px;line-height:1.15\">Ask Navigator<\u002fspan><span style=\"display:block;font-size:10.5px;opacity:0.8\">Plain-English queries<\u002fspan><\u002fspan>\n    <\u002fbutton>\n    <sc-for list=\"{{navItems}}\" as=\"item\" hint-placeholder-count=\"4\">\n      <sc-if value=\"{{item.isHdr}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-500);padding:14px 12px 4px\">{{item.n}}<\u002fdiv>\n      <\u002fsc-if>\n      <sc-if value=\"{{item.isBtn}}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{item.go}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;border:none;background:{{item.bg}};color:{{item.fg}};font-family:inherit;font-size:14px;font-weight:{{item.fw}};padding:9px 12px;cursor:pointer;text-align:left\" style-hover=\"background:{{item.hbg}}\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.d}}\"><\u002fpath><\u002fsvg>\n          {{item.n}}<span style=\"margin-left:auto;font-size:11px;font-weight:700;color:{{item.badgeC}}\">{{item.badge}}<\u002fspan>\n        <\u002fbutton>\n      <\u002fsc-if>\n    <\u002fsc-for>\n    <div style=\"flex:1\"><\u002fdiv>\n    <div style=\"border:1px solid var(--color-neutral-200);border-radius:12px;padding:10px 12px;background:var(--color-surface);margin-bottom:10px\">\n      <div style=\"font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:6px\">Demo \u00b7 switch persona<\u002fdiv>\n      <div style=\"display:flex;flex-direction:col (--color-neutral-600)\">{{kRejV}}<\u002fspan><\u002fdiv>\n          <div style=\"font-size:12.5px;margin-top:6px\"><span style=\"color:var(--color-accent-700);font-weight:600\">{{kRejBack}} came back with a valid PO<\u002fspan> <span style=\"color:var(--color-accent-900);font-weight:600\">\u00b7 {{kRejOut}} still out<\u002fspan><\u002fdiv>\n        <\u002fdiv>\n        <div sc-camel-on-click=\"{{paneAcc}}\" style=\"cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;background:var(--color-accent-100);border:1px solid var(--color-accent-300);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;min-height:128px\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,71,171,0.16)\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-800);font-weight:700\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0z\"><\u002fpath><\u002fsvg>\n            Accrual exposure\n          <\u002fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:34px;line-height:1;margin-top:auto;color:var(--color-accent-900)\">{{kAcc}}<\u002fdiv>\n          <div style=\"font-size:12.5px;margin-top:6px;color:var(--color-accent-800)\">{{kAccN}} rejected or deleted invoices \u2014 obligations not currently visible in SAP<\u002fdiv>\n        <\u002fdiv>\n        <div sc-camel-on-click=\"{{paneNud}}\" style=\"cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:16px 18px;display:flex;flex-direction:column;min-height:128px\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,71,171,0.16)\">\n          <div style=\"font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Nudges \u00b7 this quarter<\u002fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:34px;line-height:1;margin-top:auto\">{{kNud}} <span style=\"font-size:19px;color:var(--color-accent-700)\">{{kNudR}}%<\u002fspan><\u002fdiv>\n          <div style=\"font-size:12.5px;margin-top:6px\" class=\"text-muted\">sent \u00b7 resolved without anyone chasing<\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n\n      <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 22px;margin-bottom:22px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:var(--grad-a);display:grid;place-items:center;flex:none\"><span style=\"width:16px;height:16px;border-radius:50%;background:#fff;display:grid;place-items:center\"><navigator-mark static=\"true\" style=\"width:11px;height:11px\"><\u002fnavigator-mark><\u002fspan><\u002fspan>\n          <h4 style=\"margin:0;font-size:16px\">Weekly leadership narrative<\u002fh4>\n          <span class=\"tag tag-outline\" style=\"font-size:10px\">AI-drafted \u00b7 you review before it leaves<\u002fspan>\n          <sc-if value=\"{{narrIdle}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{genNarr}}\" style=\"margin-left:auto\">Generate this week's narrative<\u002fbutton><\u002fsc-if>\n          <sc-if value=\"{{narrDone}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-secondary\" sc-  <h4 style=\"margin:0 0 4px;font-size:15px\">Stage ageing<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 14px\">Open items by stage and SLA status<\u002fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ageing}}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px\" title=\"{{a.tip}}\">\n                <span style=\"width:64px;font-size:11.5px;font-weight:600;color:var(--color-neutral-700);flex:none\">{{a.s}}<\u002fspan>\n                <div style=\"flex:1;display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--color-surface)\">\n                  <div style=\"width:{{a.wOk}};background:var(--color-accent-200)\" title=\"{{a.tipOk}}\"><\u002fdiv>\n                  <div style=\"width:{{a.wWarn}};background:var(--color-accent-400)\" title=\"{{a.tipWarn}}\"><\u002fdiv>\n                  <div style=\"width:{{a.wBad}};background:var(--color-accent-800)\" title=\"{{a.tipBad}}\"><\u002fdiv>\n                <\u002fdiv>\n                <span style=\"width:70px;font-size:11px;color:var(--color-neutral-600);flex:none;text-align:right\"><b style=\"color:var(--color-accent-800)\">{{a.breach}}<\u002fb> over SLA<\u002fspan>\n              <\u002fdiv>\n            <\u002fsc-for>\n          <\u002fdiv>\n          <div style=\"display:flex;gap:14px;font-size:11px;color:var(--color-neutral-600);margin-top:12px\">\n            <span style=\"display:inline-flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;border-radius:2px;background:var(--color-accent-200);display:inline-block\"><\u002fi>Within SLA<\u002fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;border-radius:2px;background:var(--color-accent-400);display:inline-block\"><\u002fi>At 80%<\u002fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px\"><i style=\"w 5);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 22px\">\n          <h4 style=\"margin:0 0 4px;font-size:15px\">Misses by department<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 14px\">Share of invoices arriving without a valid PO \u2014 ranked<\u002fp>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <sc-for list=\"{{deptAdh}}\" as=\"d\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:10px\" title=\"{{d.d}} \u2014 {{d.miss}}% of invoices arrive without a valid PO\">\n                <span style=\"width:110px;font-size:11.5px;color:var(--color-neutral-700);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{d.d}}<\u002fspan>\n                <div style=\"flex:1;height:14px;border-radius:4px;background:var(--color-surface);overflow:hidden\"><div style=\"width:{{d.w}};height:100%;background:{{d.c}};border-radius:4px\"><\u002fdiv><\u002fdiv>\n                <span style=\"width:36px;font-size:11.5px;font-weight:700;text-align:right;flex:none;color:{{d.tc}}\">{{d.miss}}%<\u002fspan>\n              <\u002fdiv>\n            <\u002fsc-for>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 22px\">\n          <h4 style=\"margin:0 0 4px;font-size:15px\">Exceptions by vendor \u00b7 intake mix<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 14px\">12 vendors carry ~45% of all exceptions<\u002fp>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:16px\">\n            <sc-for list tyle=\"display:inline-flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;border-radius:2px;background:var(--color-neutral-400);display:inline-block\"><\u002fi>Fieldlink 20%<\u002fspan>\n            <\u002fdiv>\n            <p style=\"font-size:12px;margin:8px 0 0;color:var(--color-accent-800);font-weight:600\">31 Fieldlink items this quarter never became a PR.<\u002fp>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 22px\">\n          <h4 style=\"margin:0 0 4px;font-size:15px\">Who carries the queue<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 14px\">Open items per owner \u00b7 top six<\u002fp>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ownerLoad}}\" as=\"o\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:10px\" title=\"{{o.n}} \u2014 {{o.c}} open items\">\n                <span style=\"width:26px;height:26px;border-radius:50%;background:var(--grad-a);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;font-size:9.5px;flex:none\">{{o.ini}}<\u002fspan>\n                <span style=\"width:104px;font-size:11.5px;color:var(--color-neutral-700);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{o.n}}<\u002fspan>\n                <div style=\"flex:1;height:8px;border-radius:99px;background:var(--color-surface);overflow:hidden\"><div style=\"width:{{o.w}};height:100%;background:var(--grad-a);border-radius:99px\"><\u002fdiv><\u002fdiv>\n                <span style=\"min-width:26px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--color-accent-100);color:var(--color-accent-800);border-radius:999px;padding:0 7px;flex:none\">{{o.c}}<\u002fspan>\n              <\u002fdiv>\n            <\u002fsc-for>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 22px\">\n          <h4 style=\"margin:0 0 4px;font-size:15px\">Recent activity<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">Latest entries on the audit trail<\u002fp>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{recentActs}}\" as=\"ra\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ra.openIt}}\" style=\"display:flex;align-items:center;gap:11px;width:100%;border:none;border-top:1px solid var(--color-divider);background:none;font-family:inherit;font-size:12.5px;padding:9px 2px;cursor:pointer;text-align:left;color:var(--color-text)\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 7%, transparent)\">\n                <span style=\"width:26px;height:26px;border-radius:50%;background:var(--color-accent-100);color:var(--color-accent-800);display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;font-size:9.5px;flex:none\">{{ra.ini}}<\u002fspan>\n                <span style=\"min-width:0;flex:1\">\n                  <span style=\"display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ra.ev}}<\u002fspan>\n                  <span class=\"text-muted\" style=\"display:block;font-size:11px\">{{ra.vendor}} \u00b7 {{ra.id}}<\u002fspan>\n                <\u002fspan>\n                <span class=\"text-muted\" style=\"font-size:11px;flex:none;white-space:nowrap\">{{ra.t}}<\u002fspan>\n              <\u002fbutton>\n            <\u002fsc-for>\n          <\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n    <\u002fdiv>\n    <\u002fsc-if>\n\n    <sc-if value=\"{{isCharts}}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Analytics\">\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin:0 0 14px\">\n        <span style=\"font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">01 \u00b7 Flow<\u002fspan>\n        <h4 style=\"margin:0;font-size:17px\">Where the days go<\u002fh4>\n        <span class=\"text-muted\" style=\"font-size:12.5px\">An item's age is time in its current stage \u2014 the SLA is the promise<\u002fspan>\n      <\u002fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px\">\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">Average days in stage vs SLA<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">Open items \u00b7 computed live from the board<\u002fp>\n          <div id=\"ch-stage\" style=\"height:240px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">GR / SE runs past its SLA \u2014 the goods-receipt confirmation is the single bottleneck to fix first.<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">Value sitting past SLA<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">USD 000s of breached items, by stage<\u002fp>\n          <div id=\"ch-risk\" style=\"height:240px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">{{riskCallout}}<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin:0 0 14px\">\n        <span style=\"font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">02 \u00b7 Root cause<\u002fspan>\n        <h4 style=\"margin:0;font-size:17px\">Where exceptions are born<\u002fh4>\n        <span class=\"text-muted\" style=\"font-size:12.5px\">Exceptions trace to an intake path and a department, not to AP<\u002fspan>\n      <\u002fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px\">\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">Intake channel \u2192 classification<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">Every open item, traced from how it entered<\u002fp>\n          <div id=\"ch-sk\" style=\"height:250px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">Fieldlink and Work Notification feed most no-PO exceptions \u2014 the root cause is intake, not people.<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">Exceptions by department and type<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">Top six departments \u00b7 open exceptions, stacked by type<\u002fp>\n          <div id=\"ch-dept\" style=\"height:250px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">Maintenance leads, and its mix is mostly missing POs from contractor work \u2014 one conversation, not ten.<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin:0 0 14px\">\n        <span style=\"font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">03 \u00b7 Interventions<\u002fspan>\n        <h4 style=\"margin:0;font-size:17px\">Is it working?<\u002fh4>\n        <span class=\"text-muted\" style=\"font-size:12.5px\">The stricter no-PO policy went live in June; the nudge engine chases daily<\u002fspan>\n      <\u002fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">First-time-right since the policy<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">Weekly \u00b7 share of invoices arriving with a valid PO<\u002fp>\n          <div id=\"ch-trend\" style=\"height:250px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">Up 13 points since the policy went live \u2014 and holding through August. \"Be stricter\" isn't decaying this time.<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n        <div style=\"background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--color-neutral-200);border-radius:16px;box-shadow:0 8px 28px rgba(0,71,171,0.08);padding:18px 20px\">\n          <h4 style=\"margin:0 0 2px;font-size:16px\">The nudge ladder<\u002fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 6px\">This quarter \u00b7 items reaching each rung<\u002fp>\n          <div id=\"ch-fn\" style=\"height:250px\"><\u002fdiv>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--color-divider);margin-top:10px;padding-top:10px\">\n            <navigator-mark static=\"true\" style=\"width:15px;height:15px;flex:none;margin-top:1px\"><\u002fnavigator-mark>\n            <span style=\"font-size:12.5px;color:var(--color-neutral-800)\">86% of nudged items clear at N1 without anyone chasing; only 14 reached a Director decision all quarter.<\u002fspan>\n          <\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n    <\u002fdiv>\n    <\u002fsc-if>\n  <\u002fdiv>\n<\u002fdiv>\n\n<sc-if value=\"{{paneOn}}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{closePane}}\" style=\"position:fixed;inset:0;background:rgba(13,31,60,0.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:62;animation:fadeIn 0.25s\"><\u002fdiv>\n  <div data-screen-label=\"Insight pane\" style=\"position:fixed;top:14px;right:14px;bottom:14px;width:min(460px,calc(100vw - 28px));z-index:63;background:rgba(255,255,255,0.86);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:1px solid rgba(255,255,255,0.9);border-radius:20px;box-shadow:0 24px 64px rgba(0,43,102,0.28);display:flex;flex-direction:column;overflow:hidden;animation:paneIn 0.3s cubic-bezier(0.2,0.8,0.2,1)\">\n    <div style=\"display:flex;align-items:flex-start;gap:12px;padding:22px 24px 14px\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:5px\">{{paneKicker}}<\u002fdiv>\n        <h3 style=\"margin:0;font-size:26px\">{{paneTitle}}<\u002fh3>\n        <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px\">{{paneSub}}<\u002fdiv>\n      <\u002fdiv>\n      <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{closePane}}\" aria-label=\"Close\" style=\"flex:none\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 1 e;color:var(--color-neutral-600);margin-bottom:4px\">Value<\u002fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:19px\">{{dw.valueFull}}<\u002fdiv>\n        <\u002fdiv>\n        <div style=\"border:1px solid var(--color-divider);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,0.5)\">\n          <div style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:4px\">In stage<\u002fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:19px;color:{{dw.ac}}\">{{dw.age}} days<\u002fdiv>\n        <\u002fdiv>\n        <div style=\"border:1px solid var(--color-divider);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,0.5)\">\n          <div style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:4px\">Nudge level<\u002fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:19px\">{{dw.nudgeLvl}}<\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n      <div>\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:8px\">Ownership<\u002fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px\">\n          <div><span class=\"text-muted\">Owner<\u002fspan><div style=\"font-weight:600\">{{dw.owner}}<\u002fdiv><\u002fdiv>\n          <div><span class=\"text-muted\">Department<\u002fspan><div style=\"font-weight:600\">{{dw.dept}} \u00b7 {{dw.cc}}<\u002fdiv><\u002fdiv>\n          <div><span class=\"text-muted\">Intake channel<\u002fspan><div style=\"font-weight:600\">{{dw.ch}}<\u002fdiv><\u002fdiv>\n          <div><span class=\"text-muted\">Original requester<\u002fspan><div style=\"font-weight:600\">{{dw.req}}<\u002fdiv><\u002fdiv>\n        <\u002fdiv>\n      <\u002fdiv>\n      <div>\n        <div style=\"f
